# Public example. Override personal paths in ignored port.local.ini.
# PC: clang-cl + MSVC tools, Windows/D3D12. No automatic input.
[port]
TITLE = Monster High: New Ghoul in School (BLES02199 01.00)
SYMBOL_PREFIX = monster_high
EBOOT_BIN = rom/monster-high/game/PS3_GAME/USRDIR/EBOOT.BIN
EBOOT_ELF = rom/monster-high/game/PS3_GAME/USRDIR/EBOOT.elf
PS3RECOMP_DIR = external/ps3recomp
LIFT_DIR = build/monster-high-lift
RECOMP_DIR = build/monster-high-lift/recompiled
SPU_DIR = build/monster-high-lift/spu
JOBS_DIR = build/monster-high-lift/spujobs
BUILD_DIR = build/monster-high-win
EXE = build/monster-high-win/MyGameRecomp.exe
HDD0_DIR = build/monster-high-hdd0
LIFT_ARGS = --jobs 2 --chunks 48
RUN_SECONDS = 130
CAP_FRAMES = 300:1:1
RUNTIME_DLL_DIR = external/ffmpeg/bin
RUNTIME_DLLS = avcodec-62.dll avutil-60.dll swresample-6.dll

[cmake]
CMAKE_LINKER = link.exe
CMAKE_C_FLAGS = /I{ROOT}/ports/monster-high/shim
CMAKE_EXE_LINKER_FLAGS = dxguid.lib
PS3RECOMP_FFMPEG_RUNTIME = ON
PS3RECOMP_FFMPEG_INCLUDE_DIR = {ROOT}/external/ffmpeg/include
PORT_LAUNCHER = OFF
PORT_REGENERATE_HLE_NIDS = ON

[env]
PS3_VERBOSE = 0
PERF = 0
PS3_VFS_ROOT = rom/monster-high/game
PS3_DEV_FLASH = rom/dev_flash
SPU_INTERP_UNLIFTED = 1
PAD_PROFILE = naruto-pc
PAD_CONFIG = ports/monster-high/monster-high-controls.ini
MONSTER_HIGH_JOB_QUEUE = 1
SPU_STEPCAP = 2000000
RSX_FP_USED_TEX = 1
RSX_TRIS_UNIQUE = 1
RSX_INDEX_BATCH = 1
SYNC_QUEUE_SLEEP = 0
USLEEP_POLITE = 0

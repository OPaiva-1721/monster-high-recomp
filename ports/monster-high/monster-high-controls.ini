; Monster High PC: experimental bindings for gameplay validation.
; Uses the shared keyboard/mouse adapter; PS3 prompts remain unchanged.
; F1 captures/releases the mouse. Escape pauses and releases it.
[move]
forward=W
backward=S
left=A
right=D

[buttons]
up=UP
down=DOWN
left=LEFT
right=RIGHT
cross=Z,SPACE
circle=X
square=F
triangle=E
l1=Q
r1=R
l2=SHIFT
r2=CTRL
start=ESC,ENTER
select=TAB
l3=NONE
r3=NONE

[mouse]
enabled=1
sensitivity=0.08
invert_y=0
capture_key=F1

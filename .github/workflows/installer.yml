name: Installer checks and source setup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s installer -p test_*.py -v
      - run: python tools/audit_publication.py --history --report build/audit.json
      - run: ./installer/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: source-setup
          path: build/package/*/dist/*
